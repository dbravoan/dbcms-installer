name: Installer quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/composer-cache
          key: ${{ runner.os }}-installer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-installer-
      - name: Install test dependencies
        run: docker compose -p installer-quality run --build --rm -T tools composer install --no-interaction --prefer-dist
      - name: Check the exact candidate
        run: |
          docker compose -p installer-quality run --rm -T tools composer check
          docker compose -p installer-quality run --rm -T tools composer test
          docker compose -p installer-quality run --rm -T tools composer test:dist
      - name: Remove disposable services
        if: always()
        run: docker compose -p installer-quality down --volumes --remove-orphans
